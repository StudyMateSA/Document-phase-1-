<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<title>Study Mate | پروتوتایپ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
 --p:#6D28D9;--p-d:#5B21B6;--p-l:#F3EEFE;--p-m:#DCCFFA;
 --neon:#00B2FF;--neon-d:#0077D9;--neon-l:#E1F5FF;
 --bg:#F8F7FC;--card:#FFFFFF;--ink:#1B1530;--mut:#6B6784;--line:#E8E5F1;
 --ok:#067647;--ok-l:#E3F7EC;--warn:#B45309;--warn-l:#FEF3C7;--err:#D92D20;--err-l:#FEE4E2;
 --r:16px;--sh:0 1px 2px rgba(27,21,48,.04),0 4px 16px -8px rgba(27,21,48,.08);
 --ring:0 0 0 4px rgba(0,178,255,.22);
}
*{box-sizing:border-box;margin:0;font-family:'Vazirmatn',system-ui,sans-serif}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.7}
button{border:0;background:none;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px;border-radius:8px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:18px;height:18px}
.logo{width:36px;height:36px;flex:none}

/* ---------- app shell ---------- */
header.top{position:sticky;top:0;z-index:20;min-height:64px;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--card);border-bottom:1px solid var(--line)}
header.top b{font-size:16px;font-weight:800}
.sp{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:99px;font-size:12px;background:var(--p-l);color:var(--p);font-weight:700;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.ib:hover{color:var(--p)}
main{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:760px;margin:auto}
.pt{font-size:20px;font-weight:800;margin-bottom:16px}
nav.bar{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav.bar button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;color:var(--mut);font-size:11.5px;font-weight:500}
nav.bar button.on{color:var(--p);font-weight:700}
nav.bar button.on:before{content:"";position:absolute;top:-5px;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 4px 4px;background:var(--neon);box-shadow:0 2px 10px rgba(0,178,255,.65)}
@media(min-width:900px){
 nav.bar{inset:64px 0 0 auto;width:232px;flex-direction:column;justify-content:flex-start;gap:4px;padding:16px 12px;border-top:0;border-left:1px solid var(--line)}
 nav.bar button{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:14px;border-radius:12px}
 nav.bar button:hover{background:var(--bg)}
 nav.bar button.on{background:var(--p-l)}
 nav.bar button.on:before{top:10px;bottom:10px;left:auto;right:-12px;width:3px;height:auto;margin:0;border-radius:4px 0 0 4px}
 main{margin-right:232px;max-width:none;padding:32px 40px 48px}
 .wrap{max-width:820px;margin:auto}
}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.hero{background:var(--p);color:#fff;border:0;display:flex;align-items:center;gap:16px;padding:20px}
.hero h2{font-size:19px;font-weight:800}.hero p{opacity:.8;font-size:13px}
h3{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
h3 .ic{color:var(--p)}
.row{display:flex;align-items:center;gap:12px}
.mut{color:var(--mut);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--p);line-height:1.5}.stat span{font-size:12px;color:var(--mut)}
.ring{--v:60;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--neon) calc(var(--v)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;flex:none}
.ring i{width:68px;height:68px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px}
.pb{height:6px;border-radius:9px;background:var(--p-l);overflow:hidden;flex:none}.pb i{display:block;height:100%;border-radius:9px;background:var(--neon)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0;padding-bottom:0}.item:first-child{padding-top:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.av.t{background:var(--neon-d)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--p-l);color:var(--p);display:grid;place-items:center;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;background:var(--p);color:#fff;font-weight:700;font-size:14.5px;transition:background .15s,transform .05s}
.btn:hover{background:var(--p-d)}.btn:active{transform:scale(.98)}
.btn.block{width:100%}.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.ghost{background:var(--p-l);color:var(--p)}.btn.ghost:hover{background:var(--p-m)}
.btn.ok{background:var(--ok)}.btn.no{background:var(--err-l);color:var(--err)}
.rb{width:36px;height:36px;border-radius:10px;background:var(--p-l);color:var(--p);display:grid;place-items:center;flex:none}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.f{margin-bottom:14px}
input,select,textarea{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);color:var(--ink);font-size:14px}
input::placeholder,textarea::placeholder{color:#A7A3BC}
textarea{height:84px;padding:10px 14px;resize:none}
input:focus,select:focus,textarea:focus{border-color:var(--neon);outline:0;box-shadow:var(--ring)}
[aria-invalid=true]{border-color:var(--err)!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#EFECF7;padding:4px;border-radius:12px;margin-bottom:14px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--card);color:var(--p);box-shadow:0 1px 3px rgba(27,21,48,.12)}
.sr{position:relative;margin-bottom:14px}.sr input{padding-right:44px}.sr .ic{position:absolute;right:14px;top:15px;color:var(--mut)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--p-m);display:grid;place-items:center;color:transparent;flex:none}
.done .chk{background:var(--p);border-color:var(--p);color:#fff}.done b{text-decoration:line-through;opacity:.5}
.st{font-size:11.5px;padding:1px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.st.a{background:var(--ok-l);color:var(--ok)}.st.w{background:var(--warn-l);color:var(--warn)}.st.x{background:#EEEDF3;color:#55526B}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:11.5px;color:var(--mut)}.wk div.on{background:var(--p);border-color:var(--p);color:#fff}.wk b{display:block;font-size:15px}
.cols{display:flex;align-items:flex-end;gap:10px;height:120px}
.cols div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.cols i{display:block;border-radius:8px 8px 4px 4px;background:var(--p-m);margin-bottom:4px}
.cols div:nth-child(4) i{background:var(--neon)}
.bub{max-width:80%;padding:10px 14px;border-radius:16px;margin-bottom:10px;font-size:13.5px;overflow-wrap:anywhere}
.bub.me{background:var(--p);color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.bub.th{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;margin-right:auto}
.chat{display:flex;gap:8px;position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){.chat{bottom:10px}}
.chat input{flex:1}.chat .btn{width:48px;padding:0}
.empty{text-align:center;color:var(--mut);padding:20px 0}
.fn{font-size:12.5px;color:var(--mut);margin:-4px 0 12px;display:block}

/* ---------- sheet / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(27,21,48,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s}
@media(min-width:900px){.ov{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fi{from{opacity:0}}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:600;display:flex;gap:8px;align-items:center;animation:fi .2s;max-width:calc(100vw - 32px)}
.toast .ic{color:var(--neon)}
.toast.bad{background:var(--err)}.toast.bad .ic{color:#fff}

/* ---------- login (flat, white) ---------- */
.lg{min-height:100vh;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(32px + env(safe-area-inset-top,0px)) 20px 32px}
.lg .logo{width:64px;height:64px}
.lg h1{font-size:26px;font-weight:800;margin-top:12px}
.lg>p{color:var(--mut);margin-bottom:28px}
.pane{width:100%;max-width:420px}
@media(min-width:600px){.lg{background:var(--bg)}.pane{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--sh)}}
.pane h2{font-size:18px;font-weight:800;margin-bottom:4px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 4px}
.role{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:18px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14.5px;transition:border-color .15s,background .15s}
.role:hover,.role:focus-visible{border-color:var(--neon);background:var(--neon-l)}
.role .ico{width:48px;height:48px;border-radius:14px}
.role:hover .ico{background:#fff}
.role small{font-weight:400;color:var(--mut);font-size:11.5px;line-height:1.6}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center;margin:20px 0}
.otp input{width:52px;height:58px;text-align:center;font-size:22px;font-weight:800;padding:0}
.lnk{color:var(--neon-d);font-weight:600;font-size:13px}
.lnk.row{min-height:40px}
.err{color:var(--err);font-size:12.5px;margin-top:6px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs></defs>
<!-- لوگو: برای جایگزینی با لوگوی اصلی، محتوای symbol#logo را با SVG/تصویر خودتان عوض کنید -->
<symbol id="logo" viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="#6D28D9"/><path d="M10 16c4-2 9-2 14 1 5-3 10-3 14-1v18c-4-2-9-2-14 1-5-3-10-3-14-1z" fill="#fff"/><path d="M24 17v18" stroke="#6D28D9" stroke-width="2"/><path d="m36 7 1.3 3 3 1.3-3 1.3L36 15.6l-1.3-3-3-1.3 3-1.3z" fill="#00B2FF"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></symbol>
<symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5A7 7 0 0 1 22 20"/></symbol>
<symbol id="i-bld" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7h4M8 11h4M8 15h4"/></symbol>
<symbol id="i-chk" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>

<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5M8 8h7"/></symbol>
<symbol id="i-srch" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M16 8l4 4-4 4M20 12H9"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>

<symbol id="i-back" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
</svg>
<div id="root"></div>
<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const FAD='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s).replace(/\d/g,d=>FAD[d]).replace(/([۰-۹])\.(?=[۰-۹])/g,'$1٫');
const en=s=>String(s).replace(/[۰-۹]/g,d=>FAD.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const nz=s=>en(s).replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const logo=c=>`<svg class="logo ${c||''}"><use href="#logo"/></svg>`;
const gv=id=>(document.getElementById(id)||{value:''}).value.trim();

/* تاریخ شمسی واقعی (به‌جای تاریخ ثابت) */
function pd(d){try{const p=new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn',{weekday:'long',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const g=t=>(p.find(x=>x.type==t)||{}).value||'';return{w:g('weekday'),y:g('year'),m:g('month'),d:g('day')}}catch(e){return{w:'',y:'',m:'',d:''}}}
const dstr=p=>fa(`${p.y}/${p.m}/${p.d}`);
const TODAY=pd(new Date());

/* ---------- state & data ---------- */
const S={role:null,tab:0,sub:0,tk:null,step:'role',pick:null,after:null,phone:'',asg:{},rep:null,otpAt:0};
let sid=1,lastKey='',tmr;
const ME='سارا احمدی';
const ROLES={student:['دانش‌آموز','مشاهده برنامه و ثبت مطالعه','user'],counselor:['مشاور','برنامه‌ریزی و پاسخ به تیکت‌ها','book'],inst:['موسسه','مدیریت مشاوران و دانش‌آموزان','bld'],admin:['ادمین سیستم','بررسی و تایید موسسات','shield']};
const TABS={student:[['خانه','home'],['برنامه','cal'],['گزارش','clip'],['تیکت','msg'],['پروفایل','user']],counselor:[['خانه','home'],['دانش‌آموزان','users'],['جلسات','cal'],['تیکت','msg']],inst:[['خانه','home'],['مشاوران','book'],['دانش‌آموزان','users'],['عملکرد','chart']],admin:[['درخواست‌ها','clip'],['موسسات','bld']]};
const ST={a:['فعال','a'],w:['در انتظار','w'],x:['غیرفعال','x']};
const chip=k=>`<span class="st ${ST[k][1]}">${ST[k][0]}</span>`;
/* n=نام f=رشته u=پر شده cap=ظرفیت s=وضعیت */
const CON=[{n:'دکتر مینا رضایی',f:'تجربی',u:12,cap:15,s:'a'},{n:'علی نوری',f:'ریاضی',u:9,cap:12,s:'a'},{n:'سارا یزدانی',f:'انسانی',u:5,cap:10,s:'a'},{n:'رضا محمدی',f:'ریاضی',u:0,cap:10,s:'w'}];
/* p=درصد پیشرفت h=ساعت هفته c=اندیس مشاور */
const STU=[{n:'سارا احمدی',f:'تجربی',p:78,h:32,c:0},{n:'امیرحسین کریمی',f:'ریاضی',p:54,h:21,c:1},{n:'نیلوفر صادقی',f:'تجربی',p:91,h:38,c:0},{n:'پارسا مرادی',f:'انسانی',p:37,h:12,c:0,warn:'۳ روز بدون ثبت گزارش'},{n:'یلدا فرهادی',f:'ریاضی',p:66,h:27,c:1}];
/* پیام‌ها: ['s'=دانش‌آموز | 'c'=مشاور, متن] */
const TK=[
 {n:'سارا احمدی',t:'سوال درباره حل مسئله‌های دیفرانسیل',d:'امروز',m:[['s','سلام، در حل تست‌های فصل مشتق گیر کردم. می‌شه راهنمایی کنید؟'],['c','سلام سارا! تست‌های ۱۲ تا ۱۸ رو دوباره ببین و فردا تحلیلش رو برام بفرست.'],['s','ممنون، فردا می‌فرستم.']]},
 {n:'امیرحسین کریمی',t:'نحوه تحلیل آزمون جامع ۶',d:'امروز',m:[['s','سلام، آزمون جامع ۶ رو چطور تحلیل کنم؟']]},
 {n:'سارا احمدی',t:'تغییر ساعت مطالعه شنبه',d:'دیروز',m:[['s','می‌تونم یک ساعت مطالعه شنبه رو به یکشنبه ببرم؟'],['c','بله، برنامه رو امشب به‌روز می‌کنم.']]},
 {n:'سارا احمدی',t:'کمک برای مرور زیست',d:'۳ روز پیش',m:[['s','برای فصل ۴ زیست از کجا شروع کنم؟'],['c','برای فصل ۴ زیست، اول نمودارها رو مرور کن.']]}
];

/* ---------- UI helpers ---------- */
const toast=(m,bad)=>{document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.setAttribute('role','status');t.innerHTML=ic(bad?'x':'chk','s')+esc(m);document.body.append(t);setTimeout(()=>t.remove(),2400)};
function sheet(t,b){
 $('.ov')?.remove();
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="row" style="margin-bottom:14px"><h3 style="margin:0;font-size:16px">${t}</h3><span class="sp"></span><button class="rb" aria-label="بستن" onclick="closeSheet()">${ic('x','s')}</button></div>${b}</div>`;
 o.onclick=e=>{if(e.target==o)closeSheet()};
 document.body.append(o);
 try{history.pushState(Object.assign(snap(),{sheet:1}),'')}catch(e){}
 setTimeout(()=>o.querySelector('input,select,textarea')?.focus(),60);
}
function closeSheet(){const o=$('.ov');if(!o)return;if(history.state&&history.state.sheet)history.back();else o.remove()}
const done=m=>{closeSheet();toast(m)};
const F=(l,t='text',p='',id='',req=0,v='')=>`<div class="f"><label${id?` for="${id}"`:''}>${l}</label><input${id?` id="${id}"`:''} type="${t}" placeholder="${p}"${req?' data-r':''} value="${esc(v)}"${t=='tel'?' inputmode="tel"':''}></div>`;
const NUM=(l,id,p='۰')=>`<div class="f"><label for="${id}">${l}</label><input id="${id}" inputmode="decimal" placeholder="${p}"></div>`;
const TA=(l,id,p='',req=0)=>`<div class="f"><label for="${id}">${l}</label><textarea id="${id}" placeholder="${p}"${req?' data-r':''}></textarea></div>`;
const SEL=(l,id,opts,sel)=>`<div class="f"><label for="${id}">${l}</label><select id="${id}">${opts.map(([v,t])=>`<option value="${v}"${String(v)==String(sel)?' selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
const sr=p=>`<div class="sr">${ic('srch','s')}<input placeholder="${p}" aria-label="${p}" oninput="filt(this)"></div>`;
const pr=v=>`<div class="pb" style="width:80px"><i style="width:${v}%"></i></div>`;
function filt(e){const q=nz(e.value).trim();document.querySelectorAll('#lst .item').forEach(i=>{i.hidden=!!q&&!nz(i.textContent).includes(q)})}
function chkf(sel){let ok=true;document.querySelector(sel).querySelectorAll('[data-r]').forEach(i=>{const bad=!i.value.trim();i.setAttribute('aria-invalid',String(bad));if(bad){if(ok)i.focus();ok=false}});if(!ok)toast('لطفا فیلدهای الزامی را پر کنید',1);return ok}
document.addEventListener('input',e=>e.target.removeAttribute&&e.target.removeAttribute('aria-invalid'));
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet()});

/* ---------- history (دکمهٔ برگشت مرورگر/گوشی) ---------- */
const key=()=>[S.role,S.tab,S.tk,S.step].join('|');
const snap=()=>({sid,role:S.role,tab:S.tab,tk:S.tk,step:S.step,pick:S.pick,after:S.after});
function sync(){const k=key();if(k===lastKey)return;lastKey=k;try{history.pushState(snap(),'')}catch(e){}}
window.addEventListener('popstate',e=>{
 const st=e.state,o=$('.ov');
 if(o)o.remove();
 if(!st||st.sid!==sid){ // عبور از مرز ورود/خروج: در همان صفحه بمان
  try{history.pushState(snap(),'')}catch(_){}
  return;
 }
 if(st.sheet){if(!o)history.back();return}
 const changed=[st.role,st.tab,st.tk,st.step].join('|')!==key();
 if(!changed)return;
 Object.assign(S,{role:st.role,tab:st.tab,tk:st.tk,step:st.step,pick:st.pick,after:st.after,sub:0});
 lastKey=key();
 render(1);window.scrollTo(0,0);
});
const go=i=>{S.tab=i;S.sub=0;S.tk=null;render()};

/* ---------- login ---------- */
const PH=/^09\d{9}$/;
function login(){
 const s=S.step,r=S.pick;let b='';
 if(s=='role')b=`<h2>خوش آمدید</h2><p class="mut">نقش خود را انتخاب کنید</p><div class="roles">${Object.entries(ROLES).map(([k,v])=>`<button class="role" onclick="pickRole('${k}')"><span class="ico">${ic(v[2])}</span>${v[0]}<small>${v[1]}</small></button>`).join('')}</div>`;
 if(s=='phone')b=`<button class="lnk row" onclick="S.step='role';render()">${ic('back','s')}تغییر نقش (${ROLES[r][0]})</button><h2 style="margin-top:16px">شماره موبایل</h2><p class="mut" style="margin-bottom:16px">کد تایید یکبار مصرف برایتان پیامک می‌شود. رمز عبور لازم نیست.</p><div class="f"><label for="ph">شماره موبایل</label><input id="ph" inputmode="tel" dir="ltr" style="text-align:right" placeholder="۰۹۱۲۳۴۵۶۷۸۹" value="${esc(S.phone)}" onkeydown="if(event.key=='Enter')sendOtp()"></div><button class="btn block" onclick="sendOtp()">دریافت کد تایید</button>${r=='inst'?`<p style="text-align:center;margin-top:16px" class="mut">موسسه جدید هستید؟ <button class="lnk" onclick="S.step='reg';render()">ثبت‌نام موسسه</button></p>`:''}<div id="er" class="err" role="alert"></div>`;
 if(s=='reg')b=`<button class="lnk row" onclick="S.step='phone';S.after=null;render()">${ic('back','s')}بازگشت</button><h2 style="margin:16px 0">ثبت‌نام موسسه</h2>${F('نام موسسه','text','','rn',1)}${F('شماره مجوز','text','','rl',1)}<div class="two">${F('نام مدیر','text','','rf',1)}${F('نام خانوادگی','text','','rg',1)}</div>${F('شماره تماس مدیر','tel','۰۹۱۲۳۴۵۶۷۸۹','rp',1)}<button class="btn block" onclick="regSubmit()">ثبت و دریافت کد</button><div id="er" class="err" role="alert"></div>`;
 if(s=='otp')b=`<button class="lnk row" onclick="S.step=S.after=='pend'?'reg':'phone';render()">${ic('back','s')}تغییر شماره</button><h2 style="margin-top:8px">کد تایید را وارد کنید</h2><p class="mut">کد ۵ رقمی به شماره ${fa(esc(S.phone))} ارسال شد.</p><div class="otp">${[0,1,2,3,4].map(i=>`<input maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="رقم ${fa(i+1)}" oninput="otpIn(this)" onkeydown="otpKey(event,this)" onpaste="otpPaste(event)">`).join('')}</div><div id="er" class="err" role="alert" style="text-align:center;margin:-10px 0 12px"></div><button class="btn block" onclick="verify()">تایید و ورود</button><p class="mut" style="text-align:center;margin-top:14px" id="tmw">ارسال مجدد تا <b id="tm" style="color:var(--neon-d)">۰۲:۰۰</b></p><p class="mut" style="text-align:center;font-size:11.5px">برای نمایش دمو هر کد ۵ رقمی قابل قبول است</p>`;
 if(s=='pend')b=`<div style="text-align:center;padding:10px 0"><span class="ico" style="margin:auto;width:64px;height:64px;border-radius:20px;background:var(--warn-l);color:var(--warn)">${ic('clock')}</span><h2 style="margin-top:16px">در انتظار تایید</h2><p class="mut" style="margin:6px 0 20px">حساب شما در حال بررسی است. پس از تایید ادمین، با پیامک مطلع می‌شوید.</p><button class="btn ghost block" onclick="S.step='role';S.after=null;render()">بازگشت به صفحه ورود</button></div>`;
 return `<div class="lg">${logo()}<h1>Study Mate</h1><p>همراه هوشمند مسیر کنکور</p><div class="pane">${b}</div></div>`;
}
function pickRole(k){S.pick=k;S.after=null;S.step='phone';render()}
function startOtp(){S.step='otp';S.otpAt=Date.now();render()}
function sendOtp(){const v=en($('#ph').value).replace(/[\s-]/g,'');S.phone=v;if(!PH.test(v)){$('#er').textContent='شماره موبایل معتبر نیست. نمونه: ۰۹۱۲۳۴۵۶۷۸۹';$('#ph').setAttribute('aria-invalid','true');return}S.after=null;startOtp()}
function regSubmit(){
 if(!chkf('.pane'))return;
 const p=en(gv('rp')).replace(/[\s-]/g,'');
 if(!PH.test(p)){$('#er').textContent='شماره تماس معتبر نیست. نمونه: ۰۹۱۲۳۴۵۶۷۸۹';$('#rp').setAttribute('aria-invalid','true');return}
 const l=en(gv('rl'));
 if(!REQ.some(r=>r.l==l))REQ.unshift({n:gv('rn'),m:gv('rf')+' '+gv('rg'),l});
 S.phone=p;S.after='pend';startOtp();
}
function otpIn(e){e.value=en(e.value).replace(/\D/g,'').slice(0,1);if(e.value&&e.nextElementSibling)e.nextElementSibling.focus();if([...document.querySelectorAll('.otp input')].every(i=>i.value))verify()}
function otpKey(ev,e){
 if(ev.key=='Backspace'&&!e.value&&e.previousElementSibling){e.previousElementSibling.focus();e.previousElementSibling.value=''}
 if(ev.key=='Enter')verify();
}
function otpPaste(ev){
 const t=en((ev.clipboardData||window.clipboardData).getData('text')).replace(/\D/g,'').slice(0,5);
 if(!t)return;ev.preventDefault();
 const els=document.querySelectorAll('.otp input');t.split('').forEach((c,i)=>els[i].value=c);
 els[Math.min(t.length,4)].focus();
 if(t.length==5)verify();
}
function verify(){
 const code=[...document.querySelectorAll('.otp input')].map(i=>i.value).join('');
 if(code.length<5){$('#er').textContent='کد ۵ رقمی را کامل وارد کنید';return}
 clearInterval(tmr);
 if(S.after=='pend'){S.step='pend';render();return}
 sid++;S.role=S.pick;S.tab=0;S.sub=0;S.tk=null;render();
}
function resend(){S.otpAt=Date.now();render(1);toast('کد جدید ارسال شد')}
function timer(){
 clearInterval(tmr);
 const tick=()=>{const e=$('#tm');if(!e){clearInterval(tmr);return}const n=Math.max(0,120-Math.floor((Date.now()-S.otpAt)/1000));
  if(n>0)e.textContent=fa(String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'));
  else{clearInterval(tmr);$('#tmw').innerHTML='<button class="lnk" onclick="resend()">ارسال مجدد کد</button>'}};
 tick();tmr=setInterval(tick,1000);
}
function logout(){sid++;S.role=null;S.step='role';S.pick=null;S.after=null;S.tab=0;S.sub=0;S.tk=null;S.asg={};render()}

/* ---------- tickets ---------- */
const lastBy=t=>t.m[t.m.length-1][0];
function tickets(me){
 if(S.tk!==null){
  const t=TK[S.tk];
  if(!t){S.tk=null;return tickets(me)}
  return `<button class="lnk row" style="margin-bottom:12px" onclick="S.tk=null;render()">${ic('back','s')}همه تیکت‌ها</button><div class="card"><b>${esc(t.t)}</b><div class="mut">${me=='c'?esc(t.n)+' • ':''}${t.d}</div></div>${t.m.map(m=>`<div class="bub ${m[0]==me?'me':'th'}">${esc(m[1])}</div>`).join('')}<div class="chat"><input id="cm" placeholder="پیام یا پاسخ خود را بنویسید" aria-label="پیام" onkeydown="if(event.key=='Enter')sendMsg('${me}')"><button class="btn" aria-label="ارسال" onclick="sendMsg('${me}')">${ic('send','s')}</button></div>`;
 }
 let list=TK.map((t,i)=>[t,i]),head;
 if(me=='s'){
  list=list.filter(([t])=>t.n==ME);
  head=`<button class="btn block" style="margin-bottom:14px" onclick="newTk()">${ic('plus','s')}تیکت جدید</button>`;
 }else{
  const un=list.filter(([t])=>lastBy(t)=='s').length;
  list=list.filter(([t])=>(lastBy(t)=='s')==!S.sub);
  head=`<div class="seg"><button class="${S.sub?'':'on'}" onclick="S.sub=0;render(1)">بی‌پاسخ (${fa(un)})</button><button class="${S.sub?'on':''}" onclick="S.sub=1;render(1)">پاسخ داده شده</button></div>`;
 }
 return head+(list.length?`<div class="card">${list.map(([t,i])=>`<button class="item" style="width:100%;text-align:right" onclick="S.tk=${i};render()"><span class="av ${me=='c'?'':'t'}">${me=='c'?esc(t.n[0]):'م'}</span><span class="sp"><b>${me=='c'?esc(t.n):'دکتر رضایی'}</b><span class="mut" style="display:block">${esc(t.t)}</span></span>${me=='s'&&lastBy(t)=='s'?'<span class="st w">در انتظار پاسخ</span>':`<span class="mut">${t.d}</span>`}</button>`).join('')}</div>`:`<div class="card empty">تیکتی وجود ندارد</div>`);
}
function sendMsg(me){const i=$('#cm'),v=i.value.trim();if(!v)return;TK[S.tk].m.push([me,v]);TK[S.tk].d='اکنون';render(1);window.scrollTo(0,document.body.scrollHeight);$('#cm')?.focus()}
function newTk(){sheet('تیکت جدید',F('موضوع','text','مثلا: سوال از درس ریاضی','tt',1)+TA('متن سوال','tb','سوالت را بنویس',1)+`<button class="btn block" onclick="addTk()">ارسال برای مشاور</button>`)}
function addTk(){if(!chkf('.sheet'))return;TK.unshift({n:ME,t:gv('tt'),d:'اکنون',m:[['s',gv('tb')]]});closeSheet();render(1);toast('تیکت ارسال شد')}

 return `<div class="seg"><button class="${S.sub?'':'on'}" onclick="S.sub=0;render(1)">روزانه</button><button class="${S.sub?'on':''}" onclick="S.sub=1;render(1)">هفتگی</button></div><div class="mut row" style="margin-bottom:12px">${ic('lock','s')}برنامه را مشاور تنظیم می‌کند و فقط خواندنی است</div>`+(S.sub?`<div class="wk" style="margin-bottom:14px">${names.map((d,i)=>{const p=pd(new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+i));return `<div class="${i==dow?'on':''}">${d}<b>${fa(Number(p.d)||'')}</b></div>`}).join('')}</div><div class="card">${[['شنبه','ریاضی، زیست'],['یکشنبه','فیزیک، شیمی'],['دوشنبه','ادبیات، زیست'],['سه‌شنبه','ریاضی، شیمی'],['چهارشنبه','آزمون جامع'],['پنجشنبه','مرور و جمع‌بندی'],['جمعه','استراحت']].map(r=>`<div class="item"><span class="ico">${ic('book')}</span><b class="sp">${r[0]}</b><span class="mut">${r[1]}</span></div>`).join('')}</div>`:`<div class="card">${TASKS.map(t=>`<div class="item"><span class="ico">${ic('clock')}</span><span class="sp"><b>${t[0]}</b><span class="mut" style="display:block">${fa(t[1])} ساعت • ${fa(t[2])} تست</span></span></div>`).join('')}</div>`);
},
()=>`<div class="seg"><button class="${S.sub?'':'on'}" onclick="S.sub=0;render(1)">گزارش روزانه</button><button class="${S.sub?'on':''}" onclick="S.sub=1;render(1)">آزمون‌ها</button></div>`+(S.sub?`<div class="card" id="exf"><h3>${ic('plus')}ثبت آزمون جدید</h3>${F('نام آزمون','text','','ex_n',1)}<div class="two">${F('شماره آزمون','text','','ex_k')}${F('تاریخ برگزاری','text','۱۴۰۵/۰۹/۰۱','ex_d')}</div>${TA('توضیحات','ex_c')}<input type="file" id="ex_f" accept="image/*,.pdf" hidden onchange="$('#fn').textContent=this.files[0]?this.files[0].name:''"><button class="btn ghost block" style="margin-bottom:8px" onclick="$('#ex_f').click()">${ic('up','s')}بارگذاری کارنامه (تصویر یا PDF)</button><span class="fn" id="fn"></span><button class="btn block" onclick="addEx()">ثبت آزمون</button></div><div class="card"><h3>آزمون‌های قبلی</h3>${EX.map(a=>`<div class="item"><span class="ico">${ic('clip')}</span><b class="sp">${esc(a[0])}</b><span class="mut">${esc(a[1])}</span></div>`).join('')}</div>`:(S.rep?`<div class="card" style="background:var(--ok-l);border-color:transparent;color:var(--ok)"><b>گزارش امروز ثبت شد</b><div class="mut" style="color:var(--ok)">${fa(S.rep.h)} ساعت مطالعه • ${fa(S.rep.t)} تست — می‌توانید دوباره ویرایش و ثبت کنید</div></div>`:'')+TASKS.map((t,i)=>`<div class="card"><b>${t[0].split(' - ')[0]}</b><div class="mut" style="margin-bottom:10px">${t[0].split(' - ')[1]}</div><div class="two">${NUM('ساعت مطالعه','rh'+i)}${NUM('تعداد تست','rt'+i)}</div><div class="f" style="margin:10px 0 0"><label for="rc${i}">توضیحات</label><input id="rc${i}" placeholder="اختیاری"></div></div>`).join('')+`<button class="btn block" onclick="saveRep()">ثبت گزارش روزانه</button>`),
()=>tickets('s'),
()=>`<div class="card row"><span class="av" style="width:60px;height:60px;font-size:22px">س</span><span><h3 style="margin:0">سارا احمدی</h3><div class="mut">دانش‌آموز • ${fa(esc(S.phone||'09123456789'))}</div></span></div><div class="card"><h3>اطلاعات شخصی</h3>${[['تاریخ تولد',PROF.birth],['ایمیل',PROF.email,1],['محل سکونت',PROF.city]].map(r=>`<div class="item"><span class="mut sp">${r[0]}</span><b${r[2]?' dir="ltr"':''}>${esc(r[1])}</b></div>`).join('')}</div><div class="card"><h3>اطلاعات تحصیلی</h3>${[['مقطع','دوازدهم'],['رشته','تجربی'],['هدف تحصیلی',PROF.goal],['آخرین معدل',fa(PROF.gpa)]].map(r=>`<div class="item"><span class="mut sp">${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')}<button class="btn ghost block" style="margin-top:12px" onclick="editProf()">ویرایش اطلاعات</button></div><div class="card"><div class="row"><span class="ico">${ic('bld')}</span><span class="sp"><b>موسسه کانون برتر</b><span class="mut" style="display:block">مشاور: دکتر مینا رضایی • غیرقابل ویرایش</span></span>${ic('lock','s')}</div></div>`],
counselor:[
()=>{const up=SES.filter(s=>s.s=='a'),un=TK.filter(t=>lastBy(t)=='s').length,ms=myStu();
return `<div class="card hero"><div><p>سلام</p><h2>دکتر مینا رضایی</h2><p>${fa(up.length)} جلسه و ${fa(un)} تیکت بی‌پاسخ پیش رو</p></div></div><div class="grid"><div class="stat"><b>${fa(ms.length)}</b><span>دانش‌آموز</span></div><div class="stat"><b>${fa(up.length)}</b><span>جلسه پیش رو</span></div><div class="stat"><b>${fa(un)}</b><span>تیکت جدید</span></div></div><div class="card"><h3>${ic('cal')}جلسات پیش رو</h3>${up.length?up.slice(0,3).map(j=>`<div class="item"><span class="av">${esc(j.n[0])}</span><span class="sp"><b>${esc(j.n)}</b><span class="mut" style="display:block">${esc(j.ti)}</span></span><span class="chip">${j.t?esc(j.t):esc(j.d)}</span></div>`).join(''):'<div class="empty">جلسه‌ای ثبت نشده است</div>'}</div>${ms.filter(([s])=>s.warn).map(([s,i])=>`<div class="card"><h3>${ic('chart')}نیازمند توجه</h3><div class="item"><span class="av" style="background:var(--warn)">${esc(s.n[0])}</span><span class="sp"><b>${esc(s.n)}</b><span class="mut" style="display:block">${s.warn}</span></span><button class="btn sm ghost" onclick="S.tab=1;S.tk=null;render();stuInfo(${i})">مشاهده</button></div></div>`).join('')}`},
()=>stuList()+`<button class="btn block" onclick="planEd()">${ic('cal','s')}طراحی برنامه برای دانش‌آموز</button>`,
()=>`<button class="btn block" style="margin-bottom:14px" onclick="newSes()">${ic('plus','s')}ثبت جلسه</button><div class="card">${SES.map(j=>`<div class="item"><span class="ico">${ic('cal')}</span><span class="sp"><b>${esc(j.n)}</b><span class="mut" style="display:block">${esc(j.d)} ${esc(j.t)}${j.ti?' • '+esc(j.ti):''}</span></span><span class="st ${j.s}">${j.s=='a'?'برگزار می‌شود':'برگزار شد'}</span></div>`).join('')}</div>`,
()=>tickets('c')],
inst:[
()=>`<div class="card hero"><div><p>پنل موسسه</p><h2>موسسه کانون برتر</h2><p>${TODAY.w} ${dstr(TODAY)}</p></div></div><div class="grid"><div class="stat"><b>${fa(CON.length)}</b><span>مشاور</span></div><div class="stat"><b>${fa(53+STU.length)}</b><span>دانش‌آموز</span></div><div class="stat"><b>${fa(36+SES.filter(s=>s.s=='x').length-1)}</b><span>جلسه برگزارشده</span></div></div><div class="card"><h3>${ic('chart')}میانگین ساعت مطالعه هفته</h3><div class="cols">${[['ش',60],['ی',75],['د',50],['س',90],['چ',70],['پ',40],['ج',30]].map(d=>`<div><i style="height:${d[1]}px"></i>${d[0]}</div>`).join('')}</div></div>`,
()=>`<div class="row" style="margin-bottom:14px"><div class="sr sp" style="margin:0">${ic('srch','s')}<input placeholder="جستجوی مشاور" aria-label="جستجوی مشاور" oninput="filt(this)"></div><button class="btn" onclick="addCon()">${ic('plus','s')}افزودن</button></div><div class="card" id="lst">${CON.map(c=>`<div class="item"><span class="av t">${esc(c.n.replace('دکتر ','')[0])}</span><span class="sp"><b>${esc(c.n)}</b><span class="mut" style="display:block">${esc(c.f)} • ظرفیت ${fa(c.u)} از ${fa(c.cap)}</span></span>${chip(c.s)}</div>`).join('')}</div>`,
()=>{const act=CON.map((c,i)=>[c,i]).filter(([c])=>c.s=='a');
return `<div class="row" style="margin-bottom:14px"><div class="sr sp" style="margin:0">${ic('srch','s')}<input placeholder="جستجوی دانش‌آموز" aria-label="جستجوی دانش‌آموز" oninput="filt(this)"></div><button class="btn" onclick="addStu()">${ic('plus','s')}افزودن</button></div><div class="card" id="lst">${STU.map((s,i)=>{const cur=S.asg[i]!==undefined?+S.asg[i]:s.c;return `<div class="item"><span class="av">${esc(s.n[0])}</span><span class="sp"><b>${esc(s.n)}</b><span class="mut" style="display:block">${esc(s.f)}${s.pending?' • دعوت‌نامه ارسال شد':''}</span></span><select style="width:auto;max-width:48%;height:38px;font-size:12.5px;padding:0 8px" aria-label="مشاور ${esc(s.n)}" onchange="S.asg[${i}]=this.value">${cur<0?'<option value="-1" selected>انتخاب مشاور</option>':''}${act.map(([c,ci])=>`<option value="${ci}"${ci==cur?' selected':''}>${esc(c.n)} (${fa(c.cap-c.u)} جا)</option>`).join('')}</select></div>`}).join('')}</div><button class="btn block" onclick="saveAsg()">${ic('swap','s')}ذخیره تخصیص‌ها</button>`},
()=>{const k=S.sub?4:1;return `<div class="seg"><button class="${S.sub?'':'on'}" onclick="S.sub=0;render(1)">هفتگی</button><button class="${S.sub?'on':''}" onclick="S.sub=1;render(1)">ماهانه</button></div>${CON.filter(c=>c.s=='a').map(c=>`<div class="card"><div class="row"><span class="av t">${esc(c.n.replace('دکتر ','')[0])}</span><b class="sp">${esc(c.n)}</b><button class="rb" aria-label="جزئیات ${esc(c.n)}" onclick="conInfo('${esc(c.n)}',${c.u},${k})">${ic('eye','s')}</button></div><div class="grid" style="margin:12px 0 0"><div class="stat"><b>${fa(c.u)}</b><span>دانش‌آموز</span></div><div class="stat"><b>${fa(c.u*3*k)}</b><span>تیکت پاسخ‌داده</span></div><div class="stat"><b>${fa(Math.max(2,c.u-4)*k)}</b><span>جلسه</span></div></div></div>`).join('')}`}],
admin:[
()=>`<h3 style="margin-bottom:12px">درخواست‌های در انتظار (${fa(REQ.length)})</h3>`+(REQ.length?REQ.map((m,i)=>`<div class="card"><div class="row"><span class="ico">${ic('bld')}</span><span class="sp"><b>${esc(m.n)}</b><span class="mut" style="display:block">مدیر: ${esc(m.m)} • مجوز: ${fa(esc(m.l))}</span></span><span class="st w">در انتظار</span></div><div class="two" style="margin-top:14px"><button class="btn ok sm" onclick="appr(${i})">${ic('chk','s')}تایید</button><button class="btn no sm" onclick="rej(${i})">${ic('x','s')}رد</button></div></div>`).join(''):`<div class="card empty">درخواست جدیدی وجود ندارد</div>`),
()=>`${sr('جستجوی موسسه')}<div class="card" id="lst">${INS.map((m,i)=>`<div class="item"><span class="ico">${ic('bld')}</span><span class="sp"><b>${esc(m.n)}</b><span class="mut" style="display:block">${fa(m.k)} مشاور</span></span>${chip(m.s)}<button class="btn sm ghost" onclick="togIns(${i})">${m.s=='x'?'فعال‌سازی':'غیرفعال'}</button></div>`).join('')}</div>`]};

/* ---------- actions ---------- */
function saveRep(){
 let h=0,t=0;
 TASKS.forEach((_,i)=>{h+=parseFloat(en(gv('rh'+i)))||0;t+=parseInt(en(gv('rt'+i)))||0});
 if(!h&&!t){toast('ساعت مطالعه یا تعداد تست حداقل یک درس را وارد کنید',1);return}
 S.rep={h,t};render(1);window.scrollTo(0,0);toast('گزارش امروز ثبت شد');
}
function addEx(){
 if(!chkf('#exf'))return;
 EX.unshift([gv('ex_n'),en(gv('ex_d'))?fa(en(gv('ex_d'))):dstr(TODAY)]);
 render(1);toast('آزمون ثبت شد');
}
function editProf(){sheet('ویرایش اطلاعات',F('ایمیل','email','','pf_e',0,PROF.email)+F('محل سکونت','text','','pf_c',1,PROF.city)+F('هدف تحصیلی','text','','pf_g',0,PROF.goal)+F('آخرین معدل','text','','pf_m',0,fa(PROF.gpa))+`<button class="btn block" onclick="saveProf()">ذخیره</button>`)}
function saveProf(){
 if(!chkf('.sheet'))return;
 const e=gv('pf_e'),m=en(gv('pf_m')).replace('٫','.');
 if(e&&!/^\S+@\S+\.\S+$/.test(e)){$('#pf_e').setAttribute('aria-invalid','true');toast('ایمیل معتبر نیست',1);return}
 if(m&&!(parseFloat(m)>=0&&parseFloat(m)<=20)){$('#pf_m').setAttribute('aria-invalid','true');toast('معدل باید بین ۰ تا ۲۰ باشد',1);return}
 Object.assign(PROF,{email:e||PROF.email,city:gv('pf_c'),goal:gv('pf_g')||PROF.goal,gpa:m||PROF.gpa});
 closeSheet();render(1);toast('ذخیره شد');
}
function newSes(){sheet('ثبت جلسه جدید',SEL('دانش‌آموز','ns_s',myStu().map(([s,i])=>[i,s.n]))+F('عنوان جلسه','text','','ns_t',1)+`<div class="two">${F('تاریخ','text','امروز','ns_d')}${F('ساعت','text','۱۶:۰۰','ns_h')}</div><button class="btn block" onclick="addSes()">ثبت جلسه</button>`)}
function addSes(){if(!chkf('.sheet'))return;SES.unshift({n:STU[+gv('ns_s')].n,d:gv('ns_d')||'امروز',t:gv('ns_h')?fa(en(gv('ns_h'))):'',s:'a',ti:gv('ns_t')});closeSheet();render(1);toast('جلسه ثبت شد')}
function addCon(){sheet('افزودن مشاور',`<div class="two">${F('نام','text','','ac_n',1)}${F('نام خانوادگی','text','','ac_l',1)}</div>${F('شماره تماس','tel','۰۹۱۲۳۴۵۶۷۸۹','ac_p',1)}<div class="two">${F('رشته','text','','ac_f')}${F('ظرفیت دانش‌آموز','text','','ac_c')}</div><p class="mut" style="margin-bottom:12px">پیامک دعوت با لینک ثبت‌نام برای مشاور ارسال می‌شود.</p><button class="btn block" onclick="saveCon()">ثبت و ارسال دعوت</button>`)}
function saveCon(){
 if(!chkf('.sheet'))return;
 if(!PH.test(en(gv('ac_p')).replace(/[\s-]/g,''))){$('#ac_p').setAttribute('aria-invalid','true');toast('شماره تماس معتبر نیست',1);return}
 CON.push({n:gv('ac_n')+' '+gv('ac_l'),f:gv('ac_f')||'—',u:0,cap:parseInt(en(gv('ac_c')))||10,s:'w'});
 closeSheet();render(1);toast('دعوت‌نامه ارسال شد');
}
function addStu(){sheet('افزودن دانش‌آموز',`<div class="two">${F('نام','text','','as_n',1)}${F('نام خانوادگی','text','','as_l',1)}</div>${F('شماره تماس','tel','۰۹۱۲۳۴۵۶۷۸۹','as_p',1)}<div class="two">${F('رشته','text','','as_f')}${F('مقطع','text','','as_g')}</div><button class="btn block" onclick="saveStu()">ثبت و ارسال دعوت</button>`)}
function saveStu(){
 if(!chkf('.sheet'))return;
 if(!PH.test(en(gv('as_p')).replace(/[\s-]/g,''))){$('#as_p').setAttribute('aria-invalid','true');toast('شماره تماس معتبر نیست',1);return}
 STU.push({n:gv('as_n')+' '+gv('as_l'),f:gv('as_f')||'—',p:0,h:0,c:-1,pending:1});
 closeSheet();render(1);toast('دعوت‌نامه ارسال شد');
}
function saveAsg(){
 let moved=0,full=0;
 Object.entries(S.asg).forEach(([i,c])=>{c=+c;const s=STU[i];if(s.c===c||c<0)return;if(CON[c].u>=CON[c].cap){full++;return}if(s.c>=0)CON[s.c].u--;CON[c].u++;s.c=c;moved++});
 S.asg={};render(1);
 full?toast('ظرفیت برخی مشاوران پر است و تغییر نکرد',1):toast(moved?'تخصیص‌ها ذخیره شد':'تغییری برای ذخیره نبود');
}
function conInfo(n,u,k){sheet(n,`<div class="grid"><div class="stat"><b>${fa(u)}</b><span>دانش‌آموز</span></div><div class="stat"><b>${fa(u*3*k)}</b><span>تیکت پاسخ‌داده</span></div><div class="stat"><b>${fa(Math.max(2,u-4)*k)}</b><span>جلسه</span></div></div><p class="mut">گزارش ${k>1?'ماهانه':'هفتگی'}</p>`)}
function appr(i){const r=REQ.splice(i,1)[0];INS.push({n:r.n,k:0,s:'a'});render(1);toast('موسسه تایید شد')}
function rej(i){sheet('دلیل رد',F('دلیل','text','','rj',1)+`<button class="btn block" onclick="doRej(${i})">ثبت رد درخواست</button>`)}
function doRej(i){if(!chkf('.sheet'))return;REQ.splice(i,1);closeSheet();render(1);toast('رد شد و پیامک ارسال شد')}
function togIns(i){INS[i].s=INS[i].s=='x'?'a':'x';render(1);toast('وضعیت تغییر کرد')}

/* ---------- render ---------- */
function render(keep){
 const r=S.role;
 if(!r){
  $('#root').innerHTML=login();
  if(S.step=='otp'){timer();$('.otp input')?.focus()}else clearInterval(tmr);
 }else{
  clearInterval(tmr);
  const T=TABS[r];
  $('#root').innerHTML=`<header class="top">${logo()}<b>Study Mate</b><span class="sp"></span><span class="chip">${ROLES[r][0]}</span><button class="ib" aria-label="خروج" onclick="logout()">${ic('out','s')}</button></header><main><div class="wrap"><h1 class="pt">${T[S.tab][0]}</h1>${V[r][S.tab]()}</div></main><nav class="bar" aria-label="منوی اصلی">${T.map((t,i)=>`<button class="${i==S.tab?'on':''}"${i==S.tab?' aria-current="page"':''} onclick="go(${i})">${ic(t[1])}${t[0]}</button>`).join('')}</nav>`;
 }
 if(!keep)window.scrollTo(0,0);
 sync();
}
lastKey=key();
try{history.replaceState(snap(),'')}catch(e){}
render();
</script>
</body>
</html>

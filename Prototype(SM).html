<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<title>Study Mate | پروتوتایپ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
 --p:#6D28D9;--p-d:#5B21B6;--p-l:#F3EEFE;--p-m:#DCCFFA;
 --neon:#00B2FF;--neon-d:#0077D9;--neon-l:#E1F5FF;
 --bg:#F8F7FC;--card:#FFFFFF;--ink:#1B1530;--mut:#6B6784;--line:#E8E5F1;
 --ok:#067647;--ok-l:#E3F7EC;--warn:#B45309;--warn-l:#FEF3C7;--err:#D92D20;--err-l:#FEE4E2;
 --r:16px;--sh:0 1px 2px rgba(27,21,48,.04),0 4px 16px -8px rgba(27,21,48,.08);
 --ring:0 0 0 4px rgba(0,178,255,.22);
}
*{box-sizing:border-box;margin:0;font-family:'Vazirmatn',system-ui,sans-serif}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.7}
button{border:0;background:none;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px;border-radius:8px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:18px;height:18px}
.logo{width:36px;height:36px;flex:none}

/* ---------- app shell ---------- */
header.top{position:sticky;top:0;z-index:20;min-height:64px;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--card);border-bottom:1px solid var(--line)}
header.top b{font-size:16px;font-weight:800}
.sp{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:99px;font-size:12px;background:var(--p-l);color:var(--p);font-weight:700;white-space:nowrap}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.ib:hover{color:var(--p)}
main{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:760px;margin:auto}
.pt{font-size:20px;font-weight:800;margin-bottom:16px}
nav.bar{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav.bar button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;color:var(--mut);font-size:11.5px;font-weight:500}
nav.bar button.on{color:var(--p);font-weight:700}
nav.bar button.on:before{content:"";position:absolute;top:-5px;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 4px 4px;background:var(--neon);box-shadow:0 2px 10px rgba(0,178,255,.65)}
@media(min-width:900px){
 nav.bar{inset:64px 0 0 auto;width:232px;flex-direction:column;justify-content:flex-start;gap:4px;padding:16px 12px;border-top:0;border-left:1px solid var(--line)}
 nav.bar button{flex:none;flex-direction:row;gap:12px;padding:12px 14px;font-size:14px;border-radius:12px}
 nav.bar button:hover{background:var(--bg)}
 nav.bar button.on{background:var(--p-l)}
 nav.bar button.on:before{top:10px;bottom:10px;left:auto;right:-12px;width:3px;height:auto;margin:0;border-radius:4px 0 0 4px}
 main{margin-right:232px;max-width:none;padding:32px 40px 48px}
 .wrap{max-width:820px;margin:auto}
}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.hero{background:var(--p);color:#fff;border:0;display:flex;align-items:center;gap:16px;padding:20px}
.hero h2{font-size:19px;font-weight:800}.hero p{opacity:.8;font-size:13px}
h3{font-size:15px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
h3 .ic{color:var(--p)}
.row{display:flex;align-items:center;gap:12px}
.mut{color:var(--mut);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--p);line-height:1.5}.stat span{font-size:12px;color:var(--mut)}
.ring{--v:60;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--neon) calc(var(--v)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;flex:none}
.ring i{width:68px;height:68px;border-radius:50%;background:var(--p);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:15px}
.pb{height:6px;border-radius:9px;background:var(--p-l);overflow:hidden;flex:none}.pb i{display:block;height:100%;border-radius:9px;background:var(--neon)}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0;padding-bottom:0}.item:first-child{padding-top:0}
.av{width:42px;height:42px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.av.t{background:var(--neon-d)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--p-l);color:var(--p);display:grid;place-items:center;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;background:var(--p);color:#fff;font-weight:700;font-size:14.5px;transition:background .15s,transform .05s}
.btn:hover{background:var(--p-d)}.btn:active{transform:scale(.98)}
.btn.block{width:100%}.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.ghost{background:var(--p-l);color:var(--p)}.btn.ghost:hover{background:var(--p-m)}
.btn.ok{background:var(--ok)}.btn.no{background:var(--err-l);color:var(--err)}
.rb{width:36px;height:36px;border-radius:10px;background:var(--p-l);color:var(--p);display:grid;place-items:center;flex:none}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.f{margin-bottom:14px}
input,select,textarea{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);color:var(--ink);font-size:14px}
input::placeholder,textarea::placeholder{color:#A7A3BC}
textarea{height:84px;padding:10px 14px;resize:none}
input:focus,select:focus,textarea:focus{border-color:var(--neon);outline:0;box-shadow:var(--ring)}
[aria-invalid=true]{border-color:var(--err)!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:#EFECF7;padding:4px;border-radius:12px;margin-bottom:14px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--card);color:var(--p);box-shadow:0 1px 3px rgba(27,21,48,.12)}
.sr{position:relative;margin-bottom:14px}.sr input{padding-right:44px}.sr .ic{position:absolute;right:14px;top:15px;color:var(--mut)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--p-m);display:grid;place-items:center;color:transparent;flex:none}
.done .chk{background:var(--p);border-color:var(--p);color:#fff}.done b{text-decoration:line-through;opacity:.5}
.st{font-size:11.5px;padding:1px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.st.a{background:var(--ok-l);color:var(--ok)}.st.w{background:var(--warn-l);color:var(--warn)}.st.x{background:#EEEDF3;color:#55526B}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;font-size:11.5px;color:var(--mut)}.wk div.on{background:var(--p);border-color:var(--p);color:#fff}.wk b{display:block;font-size:15px}
.cols{display:flex;align-items:flex-end;gap:10px;height:120px}
.cols div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.cols i{display:block;border-radius:8px 8px 4px 4px;background:var(--p-m);margin-bottom:4px}
.cols div:nth-child(4) i{background:var(--neon)}
.bub{max-width:80%;padding:10px 14px;border-radius:16px;margin-bottom:10px;font-size:13.5px;overflow-wrap:anywhere}
.bub.me{background:var(--p);color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.bub.th{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px;margin-right:auto}
.chat{display:flex;gap:8px;position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media(min-width:900px){.chat{bottom:10px}}
.chat input{flex:1}.chat .btn{width:48px;padding:0}
.empty{text-align:center;color:var(--mut);padding:20px 0}
.fn{font-size:12.5px;color:var(--mut);margin:-4px 0 12px;display:block}

/* ---------- sheet / toast ---------- */
.ov{position:fixed;inset:0;background:rgba(27,21,48,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s}
@media(min-width:900px){.ov{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fi{from{opacity:0}}
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:600;display:flex;gap:8px;align-items:center;animation:fi .2s;max-width:calc(100vw - 32px)}
.toast .ic{color:var(--neon)}
.toast.bad{background:var(--err)}.toast.bad .ic{color:#fff}

/* ---------- login (flat, white) ---------- */
.lg{min-height:100vh;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(32px + env(safe-area-inset-top,0px)) 20px 32px}
.lg .logo{width:64px;height:64px}
.lg h1{font-size:26px;font-weight:800;margin-top:12px}
.lg>p{color:var(--mut);margin-bottom:28px}
.pane{width:100%;max-width:420px}
@media(min-width:600px){.lg{background:var(--bg)}.pane{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--sh)}}
.pane h2{font-size:18px;font-weight:800;margin-bottom:4px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 4px}
.role{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:18px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14.5px;transition:border-color .15s,background .15s}
.role:hover,.role:focus-visible{border-color:var(--neon);background:var(--neon-l)}
.role .ico{width:48px;height:48px;border-radius:14px}
.role:hover .ico{background:#fff}
.role small{font-weight:400;color:var(--mut);font-size:11.5px;line-height:1.6}
.otp{display:flex;gap:8px;direction:ltr;justify-content:center;margin:20px 0}
.otp input{width:52px;height:58px;text-align:center;font-size:22px;font-weight:800;padding:0}
.lnk{color:var(--neon-d);font-weight:600;font-size:13px}
.lnk.row{min-height:40px}
.err{color:var(--err);font-size:12.5px;margin-top:6px}

/* ---------- v2 redesign ---------- */
:root{--g:linear-gradient(135deg,#6D28D9 0%,#5B21B6 58%,#0077D9 135%);--r:20px;--sh:0 1px 2px rgba(27,21,48,.04),0 10px 26px -14px rgba(27,21,48,.16)}
header.top{background:rgba(255,255,255,.88);backdrop-filter:blur(10px)}
.wm span,.lg h1 span{background:linear-gradient(90deg,#6D28D9,#00B2FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{filter:drop-shadow(0 4px 8px rgba(109,40,217,.28))}
.card{padding:18px}
.hero{background:var(--g);position:relative;overflow:hidden;padding:22px;box-shadow:0 16px 32px -18px rgba(91,33,182,.7)}
.hero:after{content:"";position:absolute;left:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.09)}
.hero>*{position:relative;z-index:1}.hero h2{line-height:1.6;margin:2px 0}
.ring i{background:#5B21B6}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 6px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center}
.kpi b{font-size:24px;font-weight:800;line-height:1.4}.kpi span{font-size:12px;color:var(--mut)}
.ki{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:6px;background:var(--p-l);color:var(--p)}
.ki.b{background:var(--neon-l);color:var(--neon-d)}.ki.c{background:var(--ok-l);color:var(--ok)}
.pb.big{height:10px}.pb.big i{background:linear-gradient(90deg,var(--p),var(--neon))}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.day{display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:12px;font-weight:600;transition:all .15s}
.day b{font-size:16px;color:var(--ink);line-height:1.5}.day i{width:5px;height:5px;border-radius:50%;background:var(--neon);margin-top:2px;opacity:0}.day.has i{opacity:1}
.day:hover{border-color:var(--p-m)}.day.today{border-color:var(--neon)}
.day.on{background:var(--g);border-color:transparent;color:#fff;transform:translateY(-3px);box-shadow:0 10px 18px -8px rgba(109,40,217,.6)}.day.on b{color:#fff}
.dh{display:flex;align-items:center;gap:12px;padding:12px 14px}
.goal{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);background:var(--bg);border-radius:10px;padding:6px 10px;margin:12px 0}
.rp{border-radius:var(--r)}.rp .st{align-self:flex-start}
.extra{border:1.5px dashed var(--p-m);background:linear-gradient(180deg,#FBF9FF,#fff)}
.extra .row{margin-bottom:14px}
.xl{background:var(--bg);border-radius:14px;padding:4px 12px;margin-bottom:14px}.xl .item{padding:10px 0}
.note{display:flex;gap:12px;align-items:center;background:var(--ok-l);color:var(--ok);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.note .mut{color:var(--ok)}
.lg{background:radial-gradient(circle at 90% 0,#E7DBFF 0,transparent 45%),radial-gradient(circle at 0 100%,#D6F0FF 0,transparent 42%),var(--bg)}
.brand{display:flex;align-items:center;gap:12px}.lg .logo{width:62px;height:62px;filter:drop-shadow(0 10px 16px rgba(109,40,217,.35))}
.lg h1{margin:0;font-size:32px;letter-spacing:-.5px}.lg>p{margin:8px 0 26px}
.pane{box-shadow:0 24px 50px -26px rgba(91,33,182,.4)}
.role{border-radius:18px}.role:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.otp input{border-radius:14px}
@media(max-width:380px){.kpi b{font-size:20px}.day b{font-size:14px}}
.st.r{background:var(--err-l);color:var(--err)}
button.kpi{cursor:pointer;font:inherit;color:inherit}.kpi:hover{border-color:var(--p-m)}
.tag{font-size:11px;font-weight:700;padding:0 8px;border-radius:99px;background:var(--neon-l);color:var(--neon-d);margin-right:6px}
.logo{width:44px;height:37px;filter:none}.lg .logo{width:44px}
.logofull{display:block;width:210px;height:221px;margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-color-scheme:dark){.logo,.logofull{background:#fff;border-radius:14px;padding:4px}}
[hidden]{display:none!important}
.ilogo{width:68px;height:68px;border-radius:20px;background:#fff;color:var(--p);display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.ilogo img{width:100%;height:100%;object-fit:cover}.ilogo .ic{width:30px;height:30px}.ilogo.big{width:84px;height:84px;background:var(--p-l);box-shadow:none;border:1px solid var(--line)}
.ik{grid-template-columns:repeat(2,1fr)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.fc{flex:none;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut)}.fc.on{background:var(--p);border-color:var(--p);color:#fff}.fc b{margin-right:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.cap{margin-top:14px}.cap .pb{margin-top:6px}
.fl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.fl select{height:42px;font-size:12.5px;padding:0 8px}
@media(max-width:520px){.fl{grid-template-columns:1fr}}
.hint{display:block;font-size:11.5px;color:var(--mut);margin-top:4px}
.ro{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.ro:last-child{border:0}.ro .mut{flex:1}.ro .ic{color:var(--mut)}
.rnote{display:flex;gap:10px;align-items:center;background:var(--p-l);color:var(--p);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px}
.pfl{display:flex;align-items:center;gap:16px}.dy{padding:10px 0;border-bottom:1px solid var(--line)}.dy:last-child{border:0}
.rg{width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--p) calc(var(--v)*1%),var(--p-l) 0);display:grid;place-items:center;position:relative;flex:none}
.rg:before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--card)}
.rg b,.rg small{position:relative;grid-area:1/1}.rg b{font-size:21px;font-weight:800;color:var(--p);transform:translateY(-8px)}.rg small{font-size:10.5px;color:var(--mut);transform:translateY(13px)}
.mss{display:flex;flex-direction:column;gap:8px}.ms{display:flex;align-items:baseline;gap:8px}.ms b{font-size:19px;font-weight:800;min-width:34px}.ms span{font-size:12.5px;color:var(--mut)}
.hb{margin-bottom:14px}.hb:last-child{margin:0}.hb .pb{margin-top:6px}
.cols .bv{display:block;font-size:11px;font-weight:700;color:var(--ink);margin-bottom:4px}.cols.g i{background:linear-gradient(180deg,var(--p),var(--p-m))}
.cv{position:relative;overflow:hidden;transition:box-shadow .2s,border-color .2s}.cv:before{content:"";position:absolute;inset:0 0 0 auto;width:4px;background:var(--p-m)}
.cv.cs-a:before{background:var(--ok)}.cv.cs-x:before{background:var(--err)}.cv.cs-i:before{background:var(--warn)}.cv:hover{border-color:var(--p-m)}
.st.a:before,.st.r:before,.st.w:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:6px;vertical-align:middle}
.fl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--sh)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.rb{transition:background .15s,transform .05s}.rb:hover{background:var(--p-m)}.rb:active,.fc:active{transform:scale(.96)}
.fc:hover:not(.on){border-color:var(--p-m);color:var(--p)}.seg button:hover:not(.on){color:var(--p)}.item{transition:background .15s}
nav.bar{background:rgba(255,255,255,.94);backdrop-filter:blur(12px)}nav.bar button{transition:color .15s,background .15s}nav.bar button .ic{transition:transform .15s}nav.bar button.on .ic{transform:scale(1.12)}
.stat{box-shadow:var(--sh);transition:transform .15s}.stat:hover{transform:translateY(-2px)}
@media(min-width:900px){.ik{grid-template-columns:repeat(4,1fr)}.kpis{gap:14px}.card{padding:20px}}
.bellb{position:relative}.bdg{position:absolute;top:-4px;left:-4px;min-width:16px;height:16px;border-radius:99px;background:var(--err);color:#fff;font-size:10px;font-style:normal;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avl{width:64px;height:64px;border-radius:50%;background:var(--p-l);color:var(--p);display:grid;place-items:center;font-size:24px;font-weight:700;overflow:hidden;flex:none}.avl img{width:100%;height:100%;object-fit:cover}
.tm{margin-bottom:10px}.tm textarea,textarea#cm{min-height:84px}
</style>
</head>
<body>

 if(t.length==6)verify();
}

function anaView(){const L=ANA.filter(x=>x.i==0).sort((a,b)=>b.d-a.d);return L.length?L.map(x=>`<div class="card"><div class="row" style="margin-bottom:10px"><span class="ico">${ic('chart')}</span><b>${DAYS[x.d]} • ${weekDate(x.d)}</b></div><div class="mut">تحلیل عملکرد</div><div>${esc(x.a)}</div><div class="mut" style="margin-top:10px">بازخورد و توصیهٔ برنامهٔ فردا</div><div>${esc(x.f)}</div></div>`).join(''):'<div class="card empty">هنوز تحلیلی ثبت نشده است</div>'}
function anaBlock(i,d,n){if(!n)return '';const a=ANA.find(x=>x.i==i&&x.d==d);return a?`<div class="card"><h3>${ic('chart')}تحلیل شبانه</h3><div class="mut">تحلیل عملکرد</div><div>${esc(a.a)}</div><div class="mut" style="margin-top:8px">توصیهٔ فردا</div><div>${esc(a.f)}</div><button class="btn ghost sm" style="margin-top:12px" onclick="anaForm(${i},${d})">ویرایش تحلیل</button></div>`:`<button class="btn ghost block" style="margin-bottom:10px" onclick="anaForm(${i},${d})">${ic('chart','s')}ثبت تحلیل شبانه</button>`}
function anaForm(i,d){const a=ANA.find(x=>x.i==i&&x.d==d)||{a:'',f:''};sheet('تحلیل شبانه • '+STU[i].n,`<p class="mut" style="margin-bottom:12px">${DAYS[d]} • ${weekDate(d)}</p><div class="f"><label for="an_a">تحلیل عملکرد امروز</label><textarea id="an_a" data-r>${esc(a.a)}</textarea></div><div class="f"><label for="an_f">بازخورد و توصیهٔ برنامهٔ فردا</label><textarea id="an_f" data-r>${esc(a.f)}</textarea></div><button class="btn block" onclick="saveAna(${i},${d})">ثبت و ارسال اعلان</button>`)}
function saveAna(i,d){if(!chkf('.sheet'))return;const a=ANA.find(x=>x.i==i&&x.d==d);if(a){a.a=gv('an_a');a.f=gv('an_f')}else ANA.push({i,d,a:gv('an_a'),f:gv('an_f')});if(i==0)notify('student','تحلیل شبانهٔ '+DAYS[d]+' از طرف مشاور ثبت شد');done('تحلیل ثبت شد و اعلان برای دانش‌آموز ارسال شد')}
const lockOf=it=>{const r=864e5-(Date.now()-it.at);if(r>0)return 'قفل ۲۴ ساعته • '+fa(Math.ceil(r/36e5))+' ساعت دیگر';if(it.s==0&&S.rep&&it.day==DAYS[(new Date().getDay()+1)%7])return 'گزارش آن روز نهایی شده';return ''};
function planEd(pre){S.pe=null;sheet('طراحی برنامه',SEL('دانش‌آموز','pe_s',myStu().map(([s,i])=>[i,s.n]),pre).replace('<select','<select onchange="plList()"')+SEL('روز','pe_d',DAYS.map(d=>[d,d]))+F('درس و مبحث','text','مثلا: ریاضی - انتگرال','pe_l',1)+`<div class="two">${NUM('ساعت مطالعه','pe_h')}${NUM('تعداد تست','pe_t')}</div><button class="btn block" id="pe_b" onclick="savePlan()">ذخیره برنامه</button><h3 style="margin-top:18px">آیتم‌های ثبت‌شده</h3><p class="mut" style="margin-bottom:8px">هر آیتم پس از ثبت ۲۴ ساعت قفل است.</p><div id="pil"></div>`);plList()}
function plList(){const e=$('#pil');if(!e)return;const s=+gv('pe_s'),L=PI.map((x,i)=>[x,i]).filter(([x])=>x.s==s);e.innerHTML=L.length?L.map(([x,i])=>{const lk=lockOf(x);return `<div class="item"><span class="ico">${ic(lk?'lock':'clock')}</span><span class="sp"><b>${esc(x.l)}</b><span class="mut" style="display:block">${x.day} • ${fa(x.h)} ساعت • ${fa(x.t)} تست${lk?' • '+lk:''}</span></span>${lk?'':`<button class="btn sm ghost" onclick="plEdit(${i})">ویرایش</button><button class="btn sm ghost" onclick="plDel(${i})">حذف</button>`}</div>`}).join(''):'<div class="empty">آیتمی ثبت نشده است</div>'}
function plEdit(i){const x=PI[i];if(lockOf(x)){toast('این آیتم قفل است',1);return}S.pe=i;$('#pe_d').value=x.day;$('#pe_l').value=x.l;$('#pe_h').value=fa(x.h);$('#pe_t').value=fa(x.t);$('#pe_b').textContent='ذخیرهٔ ویرایش'}
function plDel(i){if(lockOf(PI[i])){toast('این آیتم قفل است',1);return}PI.splice(i,1);plList();toast('آیتم حذف شد')}
function savePlan(){if(!chkf('.sheet'))return;const o={s:+gv('pe_s'),day:gv('pe_d'),l:gv('pe_l'),h:parseFloat(en(gv('pe_h')))||0,t:parseInt(en(gv('pe_t')))||0};
 if(S.pe!=null){if(lockOf(PI[S.pe])){toast('این آیتم قفل است',1);return}Object.assign(PI[S.pe],o)}else PI.push({...o,at:Date.now()});
 S.pe=null;['pe_l','pe_h','pe_t'].forEach(k=>$('#'+k).value='');$('#pe_b').textContent='ذخیره برنامه';plList();toast('برنامه ذخیره شد؛ تا ۲۴ ساعت قفل است')}
const tmin=v=>{const m=en(v).match(/^(\d{1,2}):(\d{2})$/);return m?+m[1]*60+ +m[2]:null};
function newSes(){sheet('ثبت جلسه جدید',SEL('دانش‌آموز','ns_s',myStu().map(([s,i])=>[i,s.n]))+F('عنوان جلسه','text','','ns_t',1)+F('تاریخ','text','امروز','ns_d')+`<div class="two">${F('ساعت شروع','text','۱۶:۰۰','ns_h',1)}${F('ساعت پایان','text','۱۷:۰۰','ns_e',1)}</div>${TA('یادداشت (اختیاری)','ns_n')}<button class="btn block" onclick="addSes()">ثبت جلسه</button>`)}
function addSes(){if(!chkf('.sheet'))return;const a=tmin(gv('ns_h')),b=tmin(gv('ns_e')),d=gv('ns_d')||'امروز';
 if(a==null||b==null||b<=a){toast('ساعت شروع و پایان معتبر نیست؛ مثلا ۱۶:۰۰ تا ۱۷:۰۰',1);return}
 const x=SES.find(j=>j.s!='n'&&j.d==d&&tmin(j.t)!=null&&a<(j.te?tmin(j.te):tmin(j.t)+60)&&tmin(j.t)<b);
 if(x){toast('با جلسهٔ '+x.n+' ('+x.t+') تداخل زمانی دارد',1);return}
 SES.unshift({n:STU[+gv('ns_s')].n,d,t:fa(en(gv('ns_h'))),te:fa(en(gv('ns_e'))),s:'a',ti:gv('ns_t'),note:gv('ns_n')});closeSheet();render(1);toast('جلسه ثبت شد')}
function sesView(){const f=S.sq,names=[...new Set(SES.map(j=>j.n))],L=SES.map((j,i)=>[j,i]).filter(([j])=>(!f.s||j.n==f.s)&&(!f.d||j.d==f.d)),c=k=>SES.filter(j=>j.s==k).length,lab={a:['برگزار می‌شود','w'],x:['برگزار شد','a'],n:['برگزار نشد','r']};
return `<button class="btn block" style="margin-bottom:14px" onclick="newSes()">${ic('plus','s')}ثبت جلسه</button><div class="kpis ik"><div class="kpi"><span class="ki">${ic('cal')}</span><b>${fa(SES.length)}</b><span>کل جلسات</span></div><div class="kpi"><span class="ki b">${ic('clock')}</span><b>${fa(c('a'))}</b><span>پیش‌رو</span></div><div class="kpi"><span class="ki c">${ic('chk')}</span><b>${fa(c('x'))}</b><span>برگزار شد</span></div><div class="kpi"><span class="ki" style="background:var(--err-l);color:var(--err)">${ic('x')}</span><b>${fa(c('n'))}</b><span>برگزار نشد</span></div></div><div class="fl" style="grid-template-columns:1fr 1fr"><select aria-label="فیلتر دانش‌آموز" onchange="S.sq.s=this.value;render(1)"><option value="">همهٔ دانش‌آموزان</option>${names.map(n=>`<option${f.s==n?' selected':''}>${esc(n)}</option>`).join('')}</select><select aria-label="فیلتر بازه" onchange="S.sq.d=this.value;render(1)"><option value="">همهٔ بازه‌ها</option>${['امروز','دیروز'].map(n=>`<option${f.d==n?' selected':''}>${n}</option>`).join('')}</select></div><div class="card">${L.map(([j,i])=>`<button class="item" style="width:100%;text-align:right" onclick="sesInfo(${i})"><span class="ico">${ic('cal')}</span><span class="sp"><b>${esc(j.n)}</b><span class="mut" style="display:block">${esc(j.d)} ${esc(j.t)}${j.te?' تا '+esc(j.te):''}${j.ti?' • '+esc(j.ti):''}</span></span><span class="st ${lab[j.s][1]}">${lab[j.s][0]}</span></button>`).join('')||'<div class="empty">جلسه‌ای یافت نشد</div>'}</div>`}
function sesInfo(i){const j=SES[i],st=STU.find(x=>x.n==j.n),r=(l,v)=>`<div class="ro"><span class="mut">${l}</span><b>${v||'—'}</b></div>`;sheet('جزئیات جلسه',r('دانش‌آموز',esc(j.n))+r('رشته',esc(st?st.f:''))+r('عنوان',esc(j.ti))+r('زمان',esc(j.d)+' '+esc(j.t)+(j.te?' تا '+esc(j.te):''))+r('یادداشت',esc(j.note||''))+(j.s=='a'?`<div class="two" style="margin-top:14px"><button class="btn ok" onclick="setSes(${i},'x')">${ic('chk','s')}برگزار شد</button><button class="btn no" onclick="setSes(${i},'n')">${ic('x','s')}برگزار نشد</button></div>`:`<p class="mut" style="margin-top:12px">وضعیت نهایی: ${j.s=='x'?'برگزار شد':'برگزار نشد'}</p>`))}
function setSes(i,k){SES[i].s=k;closeSheet();render(1);toast(k=='x'?'جلسه برگزار شد ثبت شد':'جلسه برگزار نشد ثبت شد')}
function cprofView(){const p=CPROF,row=(l,v,d)=>`<div class="item"><span class="mut sp">${l}</span><b${d?' dir="ltr"':''}>${esc(v)}</b></div>`;
return `<div class="card row"><span class="avl">${p.photo?`<img src="${p.photo}" alt="">`:esc(p.fn[0])}</span><span class="sp"><h3 style="margin:0">${esc('دکتر '+p.fn+' '+p.ln)}</h3><div class="mut">مشاور</div><label class="lnk" for="cpf">${p.photo?'تغییر تصویر':'بارگذاری تصویر'}</label><input id="cpf" type="file" accept="image/*" hidden onchange="upImg(this,CPROF)"></span></div><div class="card"><h3>اطلاعات شخصی</h3>${row('نام',p.fn)}${row('نام خانوادگی',p.ln)}${row('تاریخ تولد',p.birth)}${row('ایمیل',p.email,1)}${row('شهر',p.city)}</div><div class="card"><h3>سوابق تحصیلی</h3>${row('آخرین مدرک',p.deg)}${row('رشته',p.field)}${row('دانشگاه',p.uni)}<button class="btn ghost block" style="margin-top:12px" onclick="editCP()">ویرایش اطلاعات</button></div><div class="card"><h3>اطلاعات غیرقابل ویرایش</h3>${row('شماره موبایل','۰۹۱۳۰۰۰۰۰۰۱')}${row('تاریخ عضویت','۱۴۰۴/۱۱/۰۵')}</div><div class="card"><h3>${ic('bld')}موسسات محل فعالیت</h3>${INSTS.map((x,i)=>`<div class="item"><span class="ico">${ic('bld')}</span><span class="sp"><b>${esc(x.n)}</b><span class="mut" style="display:block">ظرفیت کل ${fa(x.cap)} • دانش‌آموز فعال ${fa(i?0:CON[0].u)}</span></span><span class="st a">فعال</span></div>`).join('')}</div>`}
function editCP(){const p=CPROF;sheet('ویرایش اطلاعات',`<div class="two">${F('نام','text','','cp_f',1,p.fn)}${F('نام خانوادگی','text','','cp_l',1,p.ln)}</div>${F('تاریخ تولد','text','','cp_b',0,p.birth)}${F('ایمیل','email','','cp_e',0,p.email)}${F('شهر','text','','cp_c',1,p.city)}${F('آخرین مدرک','text','','cp_d',0,p.deg)}${F('رشته','text','','cp_r',0,p.field)}${F('دانشگاه','text','','cp_u',0,p.uni)}<button class="btn block" onclick="saveCP()">ذخیره</button>`)}
function saveCP(){if(!chkf('.sheet'))return;const e=gv('cp_e');if(e&&!/^\S+@\S+\.\S+$/.test(e)){toast('ایمیل معتبر نیست',1);return}Object.assign(CPROF,{fn:gv('cp_f'),ln:gv('cp_l'),birth:gv('cp_b')||CPROF.birth,email:e||CPROF.email,city:gv('cp_c'),deg:gv('cp_d')||CPROF.deg,field:gv('cp_r')||CPROF.field,uni:gv('cp_u')||CPROF.uni});closeSheet();render(1);toast('ذخیره شد')}
function showHist(){sheet('تاریخچهٔ تخصیص',HIST.length?HIST.map(h=>`<div class="item"><span class="ico">${ic('swap')}</span><span class="sp"><b>${esc(h.n)}</b><span class="mut" style="display:block">${esc(h.f)} ← ${esc(h.t)} • ${h.d}</span></span></div>`).join(''):'<div class="empty">تاریخچه‌ای ثبت نشده است</div>')}

/* ---------- render ---------- */
function render(keep){
 const r=S.role;
 if(!r){
  $('#root').innerHTML=login();
  if(S.step=='otp'){timer();$('.otp input')?.focus()}else clearInterval(tmr);
 }else{
  clearInterval(tmr);
  const T=TABS[r];
  $('#root').innerHTML=`<header class="top">${logo()}<b class="wm">Study <span>Mate</span></b><span class="sp"></span><span class="chip">${ROLES[r][0]}</span>${bell(r)}<button class="ib" aria-label="خروج" onclick="logout()">${ic('out','s')}</button></header><main><div class="wrap"><h1 class="pt">${T[S.tab][0]}</h1>${V[r][S.tab]()}</div></main><nav class="bar" aria-label="منوی اصلی">${T.map((t,i)=>`<button class="${i==S.tab?'on':''}"${i==S.tab?' aria-current="page"':''} onclick="go(${i})">${ic(t[1])}${t[0]}</button>`).join('')}</nav>`;
 }
 if(!keep)window.scrollTo(0,0);
 sync();
}
lastKey=key();
try{history.replaceState(snap(),'')}catch(e){}
render();
</script>
</body>
</html>
